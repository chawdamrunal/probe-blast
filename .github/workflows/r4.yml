name: r4-action-env-capture
on:
  workflow_dispatch:
jobs:
  r4:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: run local action (captures action-process env incl runtime token via tunnel)
        uses: ./actions/dump-env
      - name: also test tool-cache variant
        uses: ./actions/dump-env
        with: {}
