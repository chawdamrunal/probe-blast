version: 2
registries:
  probe-registry:
    type: gem-server
    url: https://speak-situations-pacific-myers.trycloudflare.com
    username: probe
    password: probe
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    registries:
      - probe-registry
    schedule:
      interval: "daily"
      time: "23:30"
      timezone: "UTC"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "23:35"
      timezone: "UTC"
